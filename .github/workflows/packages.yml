# SPDX-License-Identifier: GPL-2.0-or-later
# Build the Debian 13 packages with scripts/build-packages.sh, each lane in a debian:trixie
# container: the host packages (beanjar, beanjar-ui, beanjar-vnc, beanjar-web, beanjar-qemu, with
# the prebuilt programs of packaging/vendor.toml) natively for amd64 and arm64, and beanjar-guest
# (architecture all) on amd64, where the x86_64 SDKs run, from every target's checked-in firmware
# facts. Pushes to main and pull requests only check that they build;
# a manual run uploads the .deb files as workflow artifacts (packaging/debian/README.md, "Built on
# GitHub").
name: Packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: host (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # upload: what a manual run keeps, architecture all once, from amd64
          - arch: amd64
            runner: ubuntu-24.04
            upload: |
              build/ci-packages/debs/*_amd64.deb
              build/ci-packages/debs/*_all.deb
          - arch: arm64
            runner: ubuntu-24.04-arm
            upload: build/ci-packages/debs/*_arm64.deb
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    timeout-minutes: 90
    steps:
      # git first, so actions/checkout clones (the version comes from the history)
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build
        run: scripts/build-packages.sh host "$GITHUB_WORKSPACE/build/ci-packages"
      - name: Upload
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beanjar-debs-${{ matrix.arch }}
          path: ${{ matrix.upload }}
          if-no-files-found: error

  # Every target in one job, one after the other: they share the downloaded wraps, the unpacked
  # sources, Mesa builds of the same configuration and (ccache) the kernel, and each target's build
  # directory is removed once it has published. Locally on four threads the lane took an hour,
  # about 9 GB at its peak. Nothing is cached between runs, for little gain: the SDKs (650 MB)
  # downloaded in under a minute, and the wraps (a few hundred MB) come with the first targets.
  guest:
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 240
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build
        run: scripts/build-packages.sh guest "$GITHUB_WORKSPACE/build/ci-packages"
      - name: Upload
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beanjar-debs-guest
          path: build/ci-packages/debs/beanjar-guest_*_all.deb
          if-no-files-found: error
