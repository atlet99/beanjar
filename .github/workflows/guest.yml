# SPDX-License-Identifier: GPL-2.0-or-later
# Build beanjar-guest (architecture all) with scripts/build-packages.sh guest, in a debian:trixie
# container on amd64, where the x86_64 SDKs run, from every target's checked-in firmware facts, and
# release it. Runs in the public repository only; in any other repository the jobs are skipped.
# A tag v<version> releases the commit it points at, here and in the Packages workflow, into one
# release: the tag must name the version the build produced (packaging/identity.py, from this
# repository's history), and scripts/release-debs.sh puts the .deb files into the release v<version>
# beside the host's, whichever workflow finishes first (packaging/debian/README.md, "Built on
# GitHub"). A manual run only checks that it builds and keeps the .deb files as a run artifact.
name: Guest

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Every target in one job, one after the other: they share the downloaded wraps, the unpacked
  # sources, Mesa builds of the same configuration and (ccache) the kernel, and each target's build
  # directory is removed once it has published. On GitHub's runner the lane takes about an hour.
  # Nothing is cached between runs: the SDKs (650 MB) download in under a minute, and the wraps (a
  # few hundred MB) come with the first targets.
  build:
    if: github.repository == 'webosbrew/beanjar'
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 240
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build
        run: scripts/build-packages.sh guest "$GITHUB_WORKSPACE/build/ci-packages"
      - name: Check the tag and sum
        working-directory: build/ci-packages/debs
        run: |
          set -- beanjar-guest_*_all.deb
          [ $# = 1 ] || { echo "expected one beanjar-guest package, found: $*" >&2; exit 1; }
          version=$(dpkg-deb -f "$1" Version)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not name the version built, $version: tag this commit v$version" >&2
            exit 1
          fi
          # the experimental x86-64 kernel's package (amd64 build machines), beside the guest's
          set -- "$1" beanjar-guest-x86-64_*_amd64.deb
          [ -f "$2" ] || { echo "no beanjar-guest-x86-64 package built" >&2; exit 1; }
          [ "$(dpkg-deb -f "$2" Version)" = "$version" ] || { echo "beanjar-guest-x86-64 is not version $version" >&2; exit 1; }
          sha256sum "$@" > SHA256SUMS
          cat SHA256SUMS
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beanjar-debs-guest
          path: |
            build/ci-packages/debs/beanjar-guest_*_all.deb
            build/ci-packages/debs/beanjar-guest-x86-64_*_amd64.deb
            build/ci-packages/debs/SHA256SUMS
          if-no-files-found: error

  release:
    needs: build
    if: github.repository == 'webosbrew/beanjar' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/release-debs.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: beanjar-debs-guest
          path: release
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd release && sha256sum -c SHA256SUMS)
          scripts/release-debs.sh "$GITHUB_REF_NAME" release/beanjar-guest_*_all.deb release/beanjar-guest-x86-64_*_amd64.deb
