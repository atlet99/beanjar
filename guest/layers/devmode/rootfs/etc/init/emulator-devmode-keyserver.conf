# Developer mode (guest/layers/devmode): the key server on port 9991, as the Developer Mode app's service
# runs it. GET /webos_rsa returns the developer key (encrypted with its passphrase) for
# `ares-novacom --getkey`; see /usr/libexec/emulator-devmode/keyserver.sh. busybox tcpsvd runs one
# handler per connection. It runs alongside the devmode job, and only in developer mode.
description "Emulator: developer mode key server on port 9991"

start on started devmode
stop on stopping devmode

respawn
console output

pre-start script
	[ -e /var/luna/preferences/devmode_enabled ] || { stop; exit 0; }
	# started devmode comes as start-devmode.sh runs, before it has written the key
	/usr/libexec/emulator-devmode/wait-key.sh 30
end script

exec /usr/bin/tcpsvd -E 0.0.0.0 9991 /usr/libexec/emulator-devmode/keyserver.sh
