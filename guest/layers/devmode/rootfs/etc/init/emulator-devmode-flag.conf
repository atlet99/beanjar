# Developer mode (guest/layers/devmode): keep /var/luna/preferences/devmode_enabled set while the layer
# is on.
#
# The layer ships the file, but with state disks mount-readwrite binds /var from cmn_data, which
# was copied from the rootfs only when that state was first mounted, and the stock shutdown.conf
# deletes the flag when the Developer Mode app's start-devmode.sh is missing. So the flag is set
# again on every boot, before sam starts (sam.conf deletes /media/developer without it) and before
# the devmode job looks at it on minimal-boot-done. com.palm.service.devmode/getDevMode reports
# it; appinstalld's dev/install and WAM's inspector check it too.
description "Emulator: developer mode flag"

start on stopped mount-readwrite

task

script
	mkdir -p /var/luna/preferences
	touch /var/luna/preferences/devmode_enabled
end script
