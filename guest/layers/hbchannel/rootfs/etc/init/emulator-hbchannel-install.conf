# Homebrew Channel (guest/layers/hbchannel): its dev install and elevated LS2 files, put in place
# once mount-readwrite has bound /media and /var from the state disks (usr/libexec/beanjar/hbchannel-install).
# "starting sam" holds sam until this task ends, so its first scan of the developer apps finds it.
description "Emulator: Homebrew Channel install"

start on stopped mount-readwrite and starting sam

task
console output

exec /usr/libexec/beanjar/hbchannel-install
