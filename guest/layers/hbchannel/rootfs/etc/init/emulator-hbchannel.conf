# Homebrew Channel (guest/layers/hbchannel): its boot, as a rooted TV's boot hook runs it, once
# it is installed (emulator-hbchannel-install) (usr/libexec/beanjar/hbchannel-start).
# HBC's startup.sh leaves telnetd and Dropbear running as daemons and ends after about 12 s.
description "Emulator: Homebrew Channel startup"

start on stopped emulator-hbchannel-install

task
console output

exec /usr/libexec/beanjar/hbchannel-start
