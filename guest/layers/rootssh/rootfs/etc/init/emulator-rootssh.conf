# Root SSH into the guest, like a rooted TV (guest/layers/rootssh). Key-only: the keys are in
# /home/root/.ssh/authorized_keys, password logins are compiled out of this dropbear
# (guest/tools/ssh/localoptions.h) and -s refuses them as well; root's password is empty.
#
# Not named "dropbear": bootd.json lists a job of that name among the FirstUse prestarts.
#
# It starts as soon as /dev/pts and /tmp are mounted, about 2 s into the boot and well before the
# Luna hubs; it answers once connman has eth0 up. The host key and authorized_keys are
# the VM's own, from the per-VM layer (the host's <vm>/identity).
description "emulator: key-only root ssh on port 22"

start on stopped mount-readonly-volatile
respawn
console output

# QEMU's hostfwd reaches the guest at slirp's 10.0.2.15 once connman has its DHCP lease. eth0 is
# connman's: a static address set here first kept connman from a lease of its own (getStatus
# without ipAddress), so a boot that fails before connman is reached only on the console.
pre-start script
	ip link set lo up || true
end script

exec /usr/sbin/dropbear -F -E -s -p 22 -r /etc/emulator/rootssh/dropbear_ed25519_host_key -P /tmp/emulator-rootssh.pid
