# Root SSH (guest/layers/rootssh): put the layer's keys back into /home/root/.ssh after mount-readwrite.
#
# With state disks, webos-relocate-rootfs-writable-content-to-flash.sh (run by mount-readwrite)
# binds /home from cmn_data, which was copied from the rootfs only when that state was first
# mounted. A state made without this layer, or with other keys, would hide the per-VM layer's
# /home/root/.ssh/authorized_keys. The VM's identity/authorized_keys on the host (with its
# id_ed25519.pub, which the launcher adds) is the source of truth: it replaces the file on every
# boot.
description "Emulator: root SSH authorized_keys from the per-VM layer"

start on stopped mount-readwrite

task
console output

script
	mkdir -p /home/root/.ssh
	cp /etc/emulator/rootssh/authorized_keys /home/root/.ssh/authorized_keys
	chown root:root /home/root /home/root/.ssh /home/root/.ssh/authorized_keys
	chmod go-w /home/root
	chmod 700 /home/root/.ssh
	chmod 600 /home/root/.ssh/authorized_keys
end script
