# gl layer: let the Wayland clients reach the GPU. devtmpfs creates /dev/dri/renderD128 as
# 0600 root, but WebAppMgr and QtWebProcess run as webappmanager2:compositor (WAM_UID/WAM_GID in
# WebAppMgr.conf), and Mesa would silently fall back to software rendering for them. The
# compositor runs as root and uses card0, which stays root-only.
description "Open the DRM render nodes to the Wayland clients"

start on stopped mknod

task

script
    for n in /dev/dri/renderD*; do
        [ -c "$n" ] && chmod 0666 "$n"
    done
end script
