# gl layer, systemd releases (webOS 5): the stock compositor on Mesa, as the Upstart
# surface-manager.override does: LD_PRELOAD=/usr/lib/libegl-kms.so makes the default EGL display a
# GBM display on /dev/dri/card0 and the compositor's native windows gbm surfaces page-flipped on
# the CRTC (guest/layers/gl/src/egl-kms.c), and it drops itself from the environment once loaded.
# surface-manager.sh's product.env appends libsystrim.so.3 to it.
[Service]
Environment=LD_PRELOAD=/usr/lib/libegl-kms.so
