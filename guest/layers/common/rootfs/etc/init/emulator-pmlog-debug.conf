# Emulator: raise the PmLog contexts listed in webos.pmlog_debug=ctx1,ctx2 on the kernel cmdline
# (PMLOG_DEBUG="ctx1 ctx2" for the launchers) to debug level before PmLogDaemon starts
# (usr/libexec/beanjar/pmlog-debug; etc/systemd/system/emulator-pmlog-debug.service on systemd).
description "Emulator: debug-level PmLog contexts from the kernel cmdline"

start on starting PmLogDaemon

task

exec /usr/libexec/beanjar/pmlog-debug
