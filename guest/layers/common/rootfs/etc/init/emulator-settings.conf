# Emulator: its own settings choices, once per state and concern (usr/libexec/beanjar/
# emulator-settings: the automatic power-off timers and Audio Guidance off;
# etc/systemd/system/emulator-settings.service on systemd). Waits for settings and the set's
# country by itself; nothing waits for it.
description "Emulator: automatic power-off timers and Audio Guidance off"

start on settingsservice-ready

exec /usr/libexec/beanjar/emulator-settings
