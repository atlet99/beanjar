# Headless (no graphics): WebAppMgr needs the compositor and a GPU. Not started, as the Upstart
# form's WebAppMgr.override (manual). With the compositor stand-in's lsm-ready (its stock
# ConditionPathExists=/tmp/lsm-ready) it started and crashed in libcbe four times in a row, and
# faultmanager rebooted the set (W20L, crash_component WebAppMgr).
# A condition that never holds ("/" always exists). Not ConditionNull=false: systemd 250 (webOS 24)
# no longer knows that key and ignored it ("Unknown key name 'ConditionNull'"), so lsm-ready.service
# started WebAppMgr, which then crash-looped on "WaylandDisplay failed to initialize hardware".
[Unit]
ConditionPathExists=!/
