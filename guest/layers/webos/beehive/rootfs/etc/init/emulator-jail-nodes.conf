# Emulator: create the device nodes and directories the jailer needs that the VM lacks.
#
# The jailer (usr/bin/jailer, configs etc/jail_*.conf, TV branch of jail_device.conf because
# nyx reports "m14tv", which sets what WT1H's "goldfinger" does: do_snd, do_pvr, devfb123) throws on a `copynod` source it cannot stat or that is not a char/
# block device, and on a `mount` source that does not exist; the whole native-app launch then
# fails. makedevs (mknod.conf, devtmpfs.mount=1) already creates /dev/lg, /dev/video0,
# /dev/pvrsrvkm, /dev/vdec, /dev/vo, /dev/logfunnel, /dev/hma, /dev/portal, /dev/spidev0.1.
# What remains is made here, only where missing, so a real device (e.g. a virtio-gpu fbdev)
# always wins.
#
# Char/block placeholders use the TV's real major:minor. The VM kernel has no driver behind
# those numbers, so open() fails with ENXIO: as harmless as /dev/null's 1:3, but an app sees
# "no such device" instead of a device that silently accepts everything, and the node becomes
# correct as soon as a matching driver exists.
#   /dev/fb0../dev/fb3        c 29:0-3   fbdev; copynod in jail_native*, jail_default (fb0)
#   /dev/mmcblk0p19, p20 (copynod): guest/initramfs/rootfs/init's nodes of the eMMC partitions,
#                         not placeholders
# Directories (bind-mount sources):
#   /dev/snd                             ALSA; only exists with a sound card (do_snd)
#   /media/cryptofs/apps/usr/palm/data/appdrm   app-DRM RODB; securitymanager also creates it
#                                        (jail_native, jail_native_game)
#   /tmp/dbgfrwk                         debug framework dir (jail_native_devmode/_mvpd)
#
# /media is bind-mounted from /mnt/lg/appstore by mount-readwrite, so run after it.
description "Emulator: placeholder device nodes and directories for the jailer"

start on stopped mount-readwrite

task

script
	for n in 0 1 2 3; do
		[ -e /dev/fb$n ] || { mknod -m 0660 /dev/fb$n c 29 $n; chgrp video /dev/fb$n; }
	done
	mkdir -p /dev/snd /media/cryptofs/apps/usr/palm/data/appdrm /tmp/dbgfrwk
end script
