# Emulator: bsppart is a lower layer of the root already (boot.conf's PAK_LOWERS), below the soc
# layer, as the Upstart releases' mount-bsp.override has it. With /proc/partinfo (lgemu.ko) the
# stock unit's condition holds, and its mount-bsp would mount the bsppart partition at
# /overlay/bsppart and overlay its bsp/ directories over / once more, above every layer.
# The unit runs, and does nothing.
[Service]
ExecStart=
ExecStart=/bin/echo "emulator: bsppart is a lower layer of the root already"
