# Emulator: the bsppart pak is a lower layer of the root already (boot.conf's PAK_LOWERS) and
# mount-bsp.service does nothing (its drop-in), so the directory the stock unit waits for,
# /overlay/bsppart/bsp/etc/systemd/system, never comes. The initramfs makes this marker instead;
# its appearance starts local-fs-pre-starfish.target as on a TV.
[Path]
PathExists=
PathExists=/run/emulator/bsp-mounted
