# Airplay is not started: no MFi keys in the TEE, no Wi-Fi adapter (as goldilocks2's airplay-adaptor.override).
# The adaptor starts the airplay daemon, which crashes in TEEC_CloseSession without a TEE context.
# A condition that never holds ("/" always exists). Not ConditionNull=false: systemd 250 (webOS 24)
# no longer knows that key and ignores it, which let the adaptor start on later releases.
[Unit]
ConditionPathExists=!/
