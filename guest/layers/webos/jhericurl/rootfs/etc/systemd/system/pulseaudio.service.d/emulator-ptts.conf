# The stock system.pa plays TTS on its own PCM, hw:0,7 ("module-alsa-sink device=hw:0,7 ...
# sink_name=ptts"); the virtio-sound card has one, hw:0,6 (pcm_output), so that module fails,
# pulseaudio exits and systemd gives up after five starts. As goldilocks' Upstart job
# emulator-pulseaudio-ptts: with no hw:0,7, the stock file with that one line a null sink.
[Service]
ExecStartPre=/bin/sh /etc/emulator/pulseaudio-ptts.sh
