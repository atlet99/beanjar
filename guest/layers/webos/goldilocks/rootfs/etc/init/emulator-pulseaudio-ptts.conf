# The stock system.pa of goldilocks and goldilocks2 (W18R, W19P) plays TTS on its own PCM, hw:0,7
# ("module-alsa-sink device=hw:0,7 ... sink_name=ptts"; the older releases' ptts is a null sink).
# The virtio-sound card has one PCM, hw:0,6 (pcm_output), so that module fails to load, pulseaudio
# exits, and Upstart stops it after ten respawns. With no hw:0,7, the stock file is used with that
# one line as the older releases have it, bind-mounted over the original before each start.
description "emulator: pulseaudio's ptts sink without hw:0,7"

start on starting pulseaudio
task

script
	f=/etc/pulse/system.pa
	# the kernel's PCM, not /dev/snd: W18R's device table makes pcmC0D0p-D7p nodes with or without one
	[ -e /sys/class/sound/pcmC0D7p ] && exit 0
	grep -q '^load-module module-alsa-sink device=hw:0,7 .*sink_name=ptts' $f || exit 0
	sed 's/^load-module module-alsa-sink device=hw:0,7 .*sink_name=ptts.*/load-module module-null-sink sink_name=ptts/' \
		$f > /tmp/emulator-system.pa
	mount --bind /tmp/emulator-system.pa $f
	echo "emulator-pulseaudio-ptts: ptts is a null sink (no hw:0,7)"
end script
