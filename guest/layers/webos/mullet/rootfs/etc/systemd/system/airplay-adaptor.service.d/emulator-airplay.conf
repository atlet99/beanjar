# The adaptor runs stock from mullet on; this file replaces jhericurl's, which kept it off.
# Since W22P the adaptor starts the airplay daemon (a luna ping that activates airplay.service) only
# when LG's server has switched AirPlay on for the set (sdx's "services" reply, kept in
# /var/lib/airplay/sdp_switch_on.flag); until then airplayStatus answers airplayRunning false.
# When it is on, W22O's daemon starts and stops cleanly without MFi keys or a TEE.
# multiviewcontroller (W22P on) waits for airplayStatus before it serves getStatus, and av-connector
# waits for multiview state before it connects video.
# The empty assignment clears the conditions set before this file.
[Unit]
ConditionPathExists=
