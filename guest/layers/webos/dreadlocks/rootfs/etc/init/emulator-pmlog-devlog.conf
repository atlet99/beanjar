# Emulator: LG's devlog switch on as soon as com.webos.pmlogd is on the bus (webos.pmlog=full on
# webOS 3; guest/initramfs/rootfs/init's PmLog block). This file has no start condition: init's
# emulator-pmlog-devlog.override gives it one for webos.pmlog=full.
#
# setdevlogstatus {"recordDevLogs":true} sets the daemon's g_collectDevLogs, which skips its
# whitelist (/etc/PmLogDaemon/whitelist.txt), and PmLogSetDevMode(1), which turns off the second
# whitelist in every client's libPmLogLib (W16R 05.70.50.01). The stock snapshot-resume-jobs.conf
# makes the same call when /var/luna/preferences/devlog_enabled exists, but only at core-boot-done,
# and /var is a state disk there (not the overlay), so no layer can provide that file; this job
# makes the call once PmLogDaemon has registered and leaves the file alone (so webos.pmlog=stock
# stays stock). Side effects as on a TV with devlog on: getdevlogstatus answers true (rdxd, uploadd
# ask), and every PmLogSetContextLevel appends to /tmp/PmLogSetContextLevel.log.
description "Emulator: PmLog devlog on once PmLogDaemon is up"

task

script
	i=0
	while [ $i -lt 30 ]; do
		if luna-send -n 1 luna://com.webos.pmlogd/setdevlogstatus '{"recordDevLogs":true}' 2>&1 |
			grep -q '"returnValue": *true'; then
			exit 0
		fi
		i=$((i + 1))
		sleep 1
	done
	echo "emulator-pmlog-devlog: setdevlogstatus did not succeed" > /dev/kmsg
end script
