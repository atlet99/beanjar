# Emulator: create the device nodes and directories the jailer needs that the VM lacks.
#
# The jailer (usr/bin/jailer, configs etc/jail_*.conf) throws on a `copynod` source it cannot stat
# or that is not a char/block device, and on a `mount` source that does not exist; the whole
# native-app launch then fails. nyx reports "k5lp", whose branch of W19P's jail_device.conf sets
# do_snd, do_pvr, do_powervr, do_nativecp, do_skylanders, devfb123, uhd, rtk and dolby. rtk.ko makes
# Realtek's nodes (/dev/auth, rtkmem, md0, rpc0..11 and rpc100, rtkaudio, vscdev, ...: targets.py's
# nodes=; /dev/gfx, Realtek's gal_gfx) and lgemu.ko the I2C buses (/dev/i2c-0..4). What remains of the branches' copynod lists
# is made here, only where missing, so a real device always wins.
#
# Placeholders are 0:0, a number no kernel gives a driver (open() fails with ENXIO), except the
# eMMC partitions, which keep their block numbers:
#   /dev/fb0..fb3, video0, video1   frame buffers and V4L2 (devfb123; rtk)
#   /dev/mali0, ump                  Mali (uhd)
#   /dev/pvrsrvkm                    PowerVR (do_pvr)
#   /dev/rpc12..rpc15                `copynodall /dev/rpc 16` (KADP opens rpc0..11 and rpc100)
#   /dev/tp, mcp_rsa, vdec, vo, hma, venus_iso_gpio, rtkteeproxy, teepriv0, dma_buf_gm, uinput
#                                    the rtk branch's other nodes, no driver here (/dev/tee0 is
#                                    rtk.ko's TEE, tee=1; the placeholder only without it)
#   /dev/mmcblk0rpmb                 the eMMC's replay-protected block (jail_native_builtin)
#   /dev/mmcblk0p19, p20, p23 (copynod): guest/initramfs/rootfs/init's nodes of the eMMC partitions,
#                             not placeholders
# Directories (bind-mount sources):
#   /dev/snd                         ALSA; only exists with a sound card (do_snd)
#   /dev/dri                         DRM; only exists with the GPU (rtk mounts it)
#   /media/cryptofs/apps/usr/palm/data/appdrm   app-DRM RODB (jail_native)
#   /tmp/dbgfrwk                     debug framework dir (jail_native_devmode/_mvpd)
#
# /media is bind-mounted from /mnt/lg/appstore by mount-readwrite, so run after it.
description "Emulator: placeholder device nodes and directories for the jailer"

start on stopped mount-readwrite

task

script
	for n in fb0 fb1 fb2 fb3 video0 video1 mali0 ump pvrsrvkm rpc12 rpc13 rpc14 rpc15 tp mcp_rsa \
		vdec vo hma venus_iso_gpio rtkteeproxy tee0 teepriv0 dma_buf_gm uinput mmcblk0rpmb; do
		[ -e /dev/$n ] || mknod -m 0660 /dev/$n c 0 0
	done
	mkdir -p /dev/snd /dev/dri /media/cryptofs/apps/usr/palm/data/appdrm /tmp/dbgfrwk
end script
