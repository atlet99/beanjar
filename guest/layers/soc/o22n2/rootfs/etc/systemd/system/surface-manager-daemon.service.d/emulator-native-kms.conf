# O22N2 ombre's stock Qt EGLFS Starfish integration owns DRM/GBM and input itself: no legacy EGL
# preload (emulator-gl.conf's libegl-kms.so). It reads the planes' IN_FORMATS, which virtio-gpu
# lists with virtio_gpu.modifiers=1 on this chip's kernel line (guest/kernel/patches/0014),
# and gets one display (starfish-virtio-output). It commits AR24 framebuffers whatever its output
# format, and the primary plane lists XR24 only: libkms-native-scanout's view alone
# (BEANJAR_NATIVE_KMS=view) gives them an XR24 view. The cursor adapter carries the stock cursor
# bitmap to the viewer.
[Service]
ExecStartPre=/usr/libexec/beanjar/starfish-virtio-output
Environment=LD_PRELOAD=/usr/lib/libkms-native-scanout.so:/usr/lib/libkms-cursor-compat.so
Environment=BEANJAR_NATIVE_KMS=view
