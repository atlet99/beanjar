# Emulator: an UHD H13 board's companion decoder (LG's D14). LG's KADP_UVD_ChipVersion reads it on
# H13 from /tmp/uvd_chip_version (0x20130713 -> D14), and LG's vdecsink sends HEVC to the companion
# when it finds one; the soc layer's vdecsink reads the same file (guest/layers/soc/src/video), so the
# HEVC pictures reach the H13 on HDMI receiver port 0, where tvservice connects the window for a
# MEDIA_UD pipeline (HEVC_VDEC + VHDMIRX). Only on H13 (M14 reads this layer's jobs too) with an
# UHD panel: hwopt's digit 3 (from 0) 2, as OSA_MD_IsSupportULTRAHD reads it.

description "Emulator: the UHD companion's chip version"

start on stopped mknod

task

script
	chip= hwopt=
	for w in $(cat /proc/cmdline); do
		case $w in
		chip=*) chip=${w#chip=} ;;
		hwopt=*) hwopt=${w#hwopt=} ;;
		esac
	done
	case $chip:$hwopt in
	H13*:???2*) echo 538117907 > /tmp/uvd_chip_version ;;
	esac
end script
