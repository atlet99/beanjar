# testguest: the open test guest (docs/dev/architecture/test-guest.md), a Buildroot userland of
# ours, not LG's. BusyBox init (sysvinit's place), no PmLog, no trust stores, no state disks, and no
# LG board data: no eMMC partition map and no NVM EEPROM (prepare.py makes none).
platform = "Test"
always_layers = []
init_system = "sysvinit"
# the guest kernel's own (Linux 6.18: CAP_CHECKPOINT_RESTORE)
cap_last_cap = 40
ddr_sizes = []
dram = 512
screen = [1280, 720]
paks = [{ file = "rootfs", serial = "rootfs", mount = "/" }]
state_disks = {}
nvm_disks = {}
emmc_disks = []
partitions = {}
