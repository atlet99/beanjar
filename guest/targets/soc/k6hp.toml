# W20H's DVB tuner initializes through WFM's V4L2 ATV device at video minor 2.
# Its live frontend_type names PAL_SI2151 / DVB_SI2169D and DVB_RDA5816; its
# matching webOS 5 GPL frontend ABI is 2.0.0. The two delivery-system lists are
# terrestrial/cable and satellite, respectively; no input signal is supplied.

base = "k6lp"

# gpio_usb_vbus and gpio_level: the USB ports' power switches and overcurrent inputs
# (soc/k6lp.toml says how they were read)
[[modules]]
name = "rtk"
params = [
    "rbus_phys=0x18000000",
    "rbus_size=0x80000",
    "pli_base=0x20000000",
    "pli_max=0x60000000",
    "pli_step=0x8000000",
    "pli_rbus=0x10000000",
    "pli_window=0x8000000",
    "pli_uncached=0x8000000",
    "pli_pad=0x10000",
    "dcu1_base=0x20000000",
    "dcu1_size=0x20000000",
    "dcu2_base=0x40000000",
    "dcu2_size=0x20000000",
    "clock90k=0xb801b6b8,0xb801b6bc",
    """nodes=rtkaudio,audio_hw,rtkvdec,rtkdemux,rtkdemod,rtkademod,vscdev,vfedev,vbedev,vpqdev,\
        vpqmemc,vpqleddev,vodev,vivtdev,sys-misc,se0,gdma_hal_gal0,hdcp2dev,otp,mcp/core,\
        mcp/cipher,mcp/dgst,mcp_core,mcp_cipher,mcp_dgst,rcp_core,venus_gpio,pwm0,rtd-logger,cec0,\
        dolbyvisionEDR0,rtk_spi,rtk_rng,rtkdelivery,video28,video30,video31""",
    "ucom_node=sys-misc",
    "waits=cec0:0xc0386106",
    "v4l2_vsc=video30,video31",
    "pwms=pwm-I-0,pwm-I-1,pwm-I-2,pwm-I-3,pwm-M-0,pwm-M-1,pwm-M-2,pwm-M-3",
    "gpio_lines=460",
    "vt=vivtdev:1920:1080:60",
    "rpc_word=100:12070:2:0x11000",
    "tee=1",
    "fb=1:512x2160",
    "vsc_screen=3840,2160",
    "gpio_level=43:1,152:1,80:1",
    "gpio_usb_vbus=42,151,81",
]
derived = "rpc-table"

[[modules]]
name = "webos_tv"
params = [
    "platform=wfm",
    "frontends=2",
    "delsys=3+16+1,5+6",
    "version=2.0.0",
    "version_cmd=0x68",
    "answers=0x80:6401,0x5d:01000000",
    "atv=2",
]
