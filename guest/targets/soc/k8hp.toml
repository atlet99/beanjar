# W22H's global firmwares (AFADATAA, AFABATPU) ship on US models (65QNED85UQA, OLED65B2PUA ...):
# its US board, the QNED85's, is the default (board-atsc.cmdline). Its Japanese firmwares
# (AFADJAAA, AFABJAPU: -arib paks) boot the Japanese QNED85 (board-arib.cmdline). No European
# board is derived. The tuner keeps its W22 frontend ABI 2.1: the Japanese board's is the
# established WFM satellite/terrestrial boundary (ISDB-T, ISDB-S); the US board's own tuner values
# are not derived yet, so it has the K8 chips' European values (soc/k8lp.toml's), as W22P's US board.

base = "k8lp"
broadcast_boards = { atsc = "/etc/emulator/board-atsc.cmdline", arib = "/etc/emulator/board-arib.cmdline" }

# gpio_usb_vbus and gpio_level: the USB ports' power switches and overcurrent inputs
# (soc/k6lp.toml says how they were read)
[[modules]]
name = "rtk"
params = [
    "rbus_phys=0x18000000",
    "rbus_size=0x80000",
    "pli_base=0x20000000",
    "pli_max=0x60000000",
    "pli_step=0x8000000",
    "pli_rbus=0x10000000",
    "pli_window=0x8000000",
    "pli_uncached=0x8000000",
    "pli_pad=0x10000",
    "dcu1_base=0x20000000",
    "dcu1_size=0x20000000",
    "dcu2_base=0x40000000",
    "dcu2_size=0x20000000",
    "clock90k=0xb801b6b8,0xb801b6bc",
    """nodes=rtkaudio,audio_hw,rtkvdec,rtkdemux,rtkdemod,rtkademod,vscdev,vfedev,vbedev,vpqdev,\
        vpqmemc,vpqleddev,vodev,vivtdev,sys-misc,sys-intmicom,se0,gdma_hal_gal0,hdcp2dev,otp,\
        mcp/core,mcp/cipher,mcp/dgst,mcp_core,mcp_cipher,mcp_dgst,rcp_core,venus_gpio,pwm0,\
        rtd-logger,cec0,dolbyvisionEDR0,rtk_spi,rtk_rng,rtkdelivery,irtx-0,video28,video30,video31""",
    "ucom_node=sys-intmicom",
    "waits=cec0:0xc0386106",
    "v4l2_vsc=video30,video31",
    "pwms=pwm-I-0,pwm-I-1,pwm-I-2,pwm-I-3,pwm-M-0,pwm-M-1,pwm-M-2,pwm-M-3",
    "gpio_lines=460",
    "vt=vivtdev:1920:1080:60",
    "rpc_word=100:12070:2:0x11000",
    "tee=1",
    "fb=1:512x2160",
    "vsc_screen=3840,2160",
    "gpio_level=33:1,152:1,27:1",
    "gpio_usb_vbus=36,151,37",
]
derived = "rpc-table"

[[modules]]
name = "webos_tv"
params = [
    "platform=wfm",
    "frontends=2",
    "delsys=9+8,8",
    "version=2.1.0",
    "version_cmd=0x68",
    "answers=0x80:6401,0x5d:01000000",
]

[broadcast_params.atsc]
webos_tv = ["delsys=3+16+1+2+5+6+18,3+16+1+2+5+6+18", "atv=2"]
