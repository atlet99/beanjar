# Current O22N2 kernel has O22-family code paths; native candidate decodes
# OLED/1080p/120Hz. A0 and 2.5G are VM choices, not retail measurements.
# Its frontend consumer requires 2.1.x through property 0x68.

base = "o22n"

[[modules]]
name = "lg115x"
params = [
    "chip_rev=0x26a0",
    "ace_rev=0x26a0",
    "platform=0x2000",
    "graphic_res=0x07800438",
    "board_opt=0x02904044",
    "ucom=1",
]

[[modules]]
name = "webos_tv"
params = [
    "platform=wfm",
    "frontends=2",
    "delsys=3+16+1,5+6",
    "version=2.1.0",
    "version_cmd=0x68",
]
