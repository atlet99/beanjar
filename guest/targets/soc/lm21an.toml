# W22A's stock GetMMAP bounds the 40-byte mmapger array at ID 120.
# Start with the existing LM21A Utopia dialect; runtime traces establish further
# differences. Sparse slots are emulator allocations, not retail DRAM addresses.
# W22A's global firmware also ships on US models (70UQ8000AUB ...): its US board is the default.

base = "lm21a"
board_cmdline = "/etc/emulator/board-atsc.cmdline"
broadcast_boards = { atsc = "/etc/emulator/board-atsc.cmdline", dvb = "/etc/emulator/board-dvb.cmdline" }

# gpio_usb_vbus and gpio_level: the USB ports' power switches and overcurrent inputs
# (soc/k6lp.toml says how they were read)
[[modules]]
name = "mstar-utopia"
params = [
    "miu_interval=0x80000000",
    "miu_len=0x20000000",
    "miu0_bus=0x20000000",
    "miu1_bus=0xa0000000",
    "mmap_ids=121",
    "mmap_slot=0x400000",
    "lx_mem_id=3",
    "lx_mem2_id=107",
    "lx_mem2_bias=0",
    "msos_pmlog=1",
    "semutex_shm_capacity=0xa00000",
    "direct_ir=1",
    "pm_micom=1",
    "gpio_lines=308",
    "mmap_u64=1",
    "gpio_level=307:1,63:1",
    "gpio_usb_vbus=96,76",
]
