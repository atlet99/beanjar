board_cmdline = "/etc/emulator/board.cmdline"
# gsI2cAllConf: NVM channel 4, slave 0xa0 (7-bit 0x50); the
# amplifier entries use channel 3 and slaves 0x54/0x56. cec=1 is the HDMI CEC adapter
# (lgemu cec.c): libcecp opens /dev/cec0 here as on O22. v4l2_hdmi=1 is the HDMI
# receiver at /dev/video12 (lgemu v4l2-hdmi.c), where eim downloads the EDID before it starts
# libcecp; W22A's and W23A's libhdmi-conn-protocol open the same node. snd_ctls=1 gives
# the sound card LG's control elements (lgemu snd.c): without them audiooutputd fails powerState
# and audiod never acknowledges Prepare Suspend, so Quick Start+'s standby stalls; the
# amplifier's reset needs "Sndout Spk Output" among them for Prepare Resume.
lgemu = [
    "i2c_buses=0,1,2,3,4,5", "i2c_dev=nvm:4:0x50,amp:3:0x2a,amp:3:0x2b", "cec=1", "v4l2_hdmi=1",
    "snd_ctls=1",
]
# LIGHT_SENSOR_1/2: channel 5 in W21A's, W22A's, W23A's and N21D's libdile_i2c
light_bus = 5
thermal = true
pointer_wakeup = true

# W21A's KADP uses the same memory-driver majors and mmapger binary records.
# The GPIO lines are rootfs libdile_gpio's (/sys/class/gpio, as W19P's; its gGPIMapTable and
# gGPOMapTable, the highest 307, USB2_OCD; W22A's and W23A's are the same), the board with
# nothing connected: CVBS1/HP_LINK and HDMI1-4_DEV_DET read 0, the USB switches' overcurrent
# outputs, USB3_OCD 63 and USB2_OCD 307, 1 (active low). Without the chip eim, audiooutputd
# and PDM log "gpio export write failed".
# GetMMAP's Linux records are 3 and 107; its runtime mmapger has 123 records.
# These are the emulator's sparse memory slots, not the physical TV's allocations.
# gpio_usb_vbus and gpio_level: the USB ports' power switches and overcurrent inputs
# (soc/k6lp.toml says how they were read)
[[modules]]
name = "mstar-utopia"
params = [
    "miu_interval=0x80000000",
    "miu_len=0x20000000",
    "miu0_bus=0x20000000",
    "miu1_bus=0xa0000000",
    "mmap_ids=123",
    "mmap_slot=0x400000",
    "lx_mem_id=3",
    "lx_mem2_id=107",
    "lx_mem2_bias=0",
    "msos_pmlog=1",
    "semutex_shm_capacity=0xa00000",
    "direct_ir=1",
    "pm_micom=1",
    "gpio_lines=308",
    "gpio_level=307:1,63:1",
    "gpio_usb_vbus=96,76",
]
