models = ["W25H"]
bring_up = ["W25H"]
tested = false
v4l2_capture = true

# W25H queue-qilian (43.22.66) exists only as the Japanese ARIB build (HE_DTV_W25H_AFADJAAA): its
# model_id.json says region ARIB, so it boots the Japanese board (soc/k24n.toml). Its fstab,
# jail_device.conf and every pin are W24H queue's (43.22.72), with the same 6.12.44 kernel
# modules (turbo.ko for si2178bpll.ko); bsppart's libkadaptor gives W24H queue's RPC answer table
# and /dev, /sys and /proc names; libhal_sys, libhal_ucom, libhalgal and libmali are W24H queue's.
[release]
base = "queue"
paks = [
    { file = "rootfs", serial = "rootfs", mount = "/" },
    { file = "bsppart", serial = "bsppart" },
    { file = "otncabi", serial = "otncabi", mount = "/mnt/otncabi" },
    { file = "otycabi", serial = "otycabi", mount = "/mnt/otycabi" },
    { file = "fonts", serial = "fonts", mount = "/mnt/fonts" },
    { file = "license", serial = "license", mount = "/mnt/license" },
]
partmap = "k24-ombre"
