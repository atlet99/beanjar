# The arm64 host build's cross file: Debian 13's aarch64 cross compiler (gcc-aarch64-linux-gnu, GCC
# 14.2, the Pi's) against Debian's own arm64 libraries, installed beside the amd64 ones with
# multiarch (role host-arm64, packaging/debian/build-deps; docs/dev/guides/build.md, "Host packages").
#
#   scripts/build.sh host-arm64
#   (meson setup --cross-file meson/cross/debian-arm64.ini build/host-arm64)
#
# An aarch64 host machine selects the host lane (meson.build); 32-bit arm selects the guest lane.
# No exe_wrapper: the build runs none of its own arm64 programs, and the tests are built, not run.

[binaries]
c = 'aarch64-linux-gnu-gcc'
cpp = 'aarch64-linux-gnu-g++'
ar = 'aarch64-linux-gnu-ar'
strip = 'aarch64-linux-gnu-strip'
readelf = 'aarch64-linux-gnu-readelf'
objcopy = 'aarch64-linux-gnu-objcopy'
nm = 'aarch64-linux-gnu-nm'
# pkgconf:arm64's wrapper: the arm64 .pc files in /usr/lib/aarch64-linux-gnu/pkgconfig
pkg-config = 'aarch64-linux-gnu-pkg-config'

[properties]
# the cross prefix CMake's build of usbipdcpp takes (host/helpers/virtcam/build-usbipdcpp.sh)
cross_prefix = 'aarch64-linux-gnu-'

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
