# The guest build's cross file for LG's NetCast line (docs/dev/architecture/netcast45.md): the NetCast
# "lgtv" Buildroot SDK of openlgtv/buildroot-nc4 (GCC 16.2, glibc 2.12, x86_64 only), for the
# 32-bit ARM code of a NetCast target (lm14-netcast45), whose firmware's glibc (2.16) and userland
# predate the webOS SDK's. The webOS targets keep meson/cross/webos-sdk.ini.
#
#   meson setup --cross-file meson/cross/lgtv-sdk.ini build/guest-lm14-netcast45 \
#     -Dsoc=lm14 -Dwebos=netcast45
#
# ARMv7-A with the softfp calling convention, the firmware's (LM14's Cortex-A9); no NEON flag:
# nothing here needs it.
#
# An SDK elsewhere: a second cross file after this one that redefines the constant sdk.

[constants]
sdk = '/opt/arm-lgtv-linux-gnueabi_sdk-buildroot'
triple = 'arm-lgtv-linux-gnueabi'
arm_flags = ['-march=armv7-a', '-mfloat-abi=softfp']

[binaries]
c = sdk / 'bin' / triple + '-gcc'
cpp = sdk / 'bin' / triple + '-g++'
ar = sdk / 'bin' / triple + '-ar'
objcopy = sdk / 'bin' / triple + '-objcopy'
nm = sdk / 'bin' / triple + '-nm'
strip = sdk / 'bin' / triple + '-strip'
readelf = sdk / 'bin' / triple + '-readelf'
pkg-config = sdk / 'bin/pkg-config'

[built-in options]
c_args = arm_flags
cpp_args = arm_flags
c_link_args = arm_flags
cpp_link_args = arm_flags

[properties]
triple = triple

[host_machine]
system = 'linux'
cpu_family = 'arm'
cpu = 'armv7-a'
endian = 'little'
