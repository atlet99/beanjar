# The guest build's cross file: the webOS Buildroot SDK (GCC 14.2, glibc 2.12, softfp; x86_64 only)
# for 32-bit ARM guest code (docs/dev/guides/build.md).
#
#   meson setup --cross-file meson/cross/webos-sdk.ini build/guest
#
# The one place for the guest's C flags: every 32-bit ARM object is built for the WT1H's Cortex-A9
# userland, ARMv7-A with the softfp calling convention (the firmware's) and NEON. The Mesa stack,
# the SSH autotools builds and libffi take them from here too, through the guest build.
#
# An SDK elsewhere: a second cross file after this one that redefines the constant, e.g.
#   [constants]
#   sdk = '/path/to/sdk/arm-webos-linux-gnueabi_sdk-buildroot'
# and `meson setup --cross-file meson/cross/webos-sdk.ini --cross-file my-sdk.ini build/guest`.
# (Later files override constants; every section is evaluated after all files are read.)

[constants]
sdk = '/opt/arm-webos-linux-gnueabi_sdk-buildroot'
triple = 'arm-webos-linux-gnueabi'
arm_flags = ['-march=armv7-a', '-mfloat-abi=softfp', '-mfpu=neon']

[binaries]
c = sdk / 'bin' / triple + '-gcc'
cpp = sdk / 'bin' / triple + '-g++'
ar = sdk / 'bin' / triple + '-ar'
strip = sdk / 'bin' / triple + '-strip'
readelf = sdk / 'bin' / triple + '-readelf'
objcopy = sdk / 'bin' / triple + '-objcopy'
nm = sdk / 'bin' / triple + '-nm'
# the SDK's wrapper: its sysroot's .pc files (GLib headers for the video layer)
pkg-config = sdk / 'bin/pkg-config'

[built-in options]
c_args = arm_flags
cpp_args = arm_flags
c_link_args = arm_flags
cpp_link_args = arm_flags

[properties]
# configure --host for the autotools builds (guest/tools/ssh)
triple = triple

[host_machine]
system = 'linux'
cpu_family = 'arm'
cpu = 'armv7-a'
endian = 'little'
